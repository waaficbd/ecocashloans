<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCash Zimbabwe - Success</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --ecocash-blue: #0066CC;
            --dark-blue: #004080;
            --light-blue: #3385D6;
            --bg-light: #F4F7FA;
            --text-dark: #2D3436;
            --text-gray: #636E72;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #0066CC 0%, #004080 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .screen-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .main-content {
            padding: 25px;
        }

        /* Top Header */
        .header-section {
            text-align: center;
            padding-top: 10px;
        }

        .check-circle {
            width: 70px;
            height: 70px;
            background-color: var(--ecocash-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 15px;
        }

        .congrats-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
            margin: 10px 0;
        }

        .sub-text {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Amount Box */
        .amount-box {
            background: linear-gradient(135deg, #0066CC, #004080);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .amount-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .amount-value {
            font-size: 36px;
            font-weight: 800;
            margin-top: 5px;
        }

        /* Info Boxes */
        .info-card {
            background-color: #FEFCE8;
            border: 1px solid #FEF08A;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: #854D0E;
            font-weight: bold;
            font-size: 13px;
        }

        .info-body {
            font-size: 13px;
            line-height: 1.5;
            color: #713F12;
        }

        /* Detail List */
        .details-list {
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        .icon-bg {
            width: 45px;
            height: 45px;
            background-color: #EFF6FF;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .detail-label {
            font-size: 11px;
            color: var(--text-gray);
            text-transform: uppercase;
        }

        .detail-val {
            font-size: 16px;
            font-weight: bold;
            color: black;
        }

        /* Buttons */
        .action-title {
            font-weight: bold;
            margin: 20px 0 15px;
            color: var(--ecocash-blue);
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-white {
            background: white;
            border: 1px solid #E2E8F0;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-weight: 600;
            color: var(--ecocash-blue);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .next-steps {
            background-color: #F8FAF5;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #E2E8F0;
        }

        .home-btn {
            background-color: var(--ecocash-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
